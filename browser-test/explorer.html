<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ravel Explorer — FizzBuzz</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #090f1b;
        color: #e7edf7;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background:
          radial-gradient(circle at 15% 0%, rgb(30 64 110 / 28%), transparent 34rem),
          #090f1b;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button,
      select,
      input {
        min-height: 2rem;
        border: 1px solid #34445b;
        border-radius: 0.4rem;
        color: #e7edf7;
        background: #111b2b;
      }

      button {
        padding: 0.35rem 0.65rem;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        border-color: #6ca4d9;
        background: #17263a;
      }

      button:disabled {
        cursor: default;
        opacity: 0.45;
      }

      button.context-action:disabled {
        display: none;
      }

      input,
      select {
        padding: 0.35rem 0.55rem;
      }

      input {
        width: min(18rem, 27vw);
      }

      :focus-visible {
        outline: 2px solid #72b7e5;
        outline-offset: 2px;
      }

      .app {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        width: 100%;
        height: 100%;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.45rem;
        min-height: 3.2rem;
        padding: 0.55rem 0.7rem;
        border-bottom: 1px solid #27364a;
        background: rgb(10 17 29 / 92%);
        backdrop-filter: blur(14px);
      }

      .brand {
        display: flex;
        align-items: baseline;
        gap: 0.55rem;
        margin-right: 0.35rem;
        white-space: nowrap;
      }

      .brand strong {
        font-size: 0.98rem;
        font-weight: 650;
        letter-spacing: 0.01em;
      }

      .muted,
      .status {
        color: #93a4ba;
        font-size: 0.78rem;
      }

      .separator {
        width: 1px;
        height: 1.65rem;
        margin: 0 0.1rem;
        background: #314057;
      }

      .status {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(18rem, 25rem);
        min-height: 0;
      }

      .canvas-wrap {
        position: relative;
        min-width: 0;
        min-height: 0;
      }

      #explorer {
        position: absolute;
        inset: 0;
      }

      .legend {
        position: absolute;
        left: 0.8rem;
        bottom: 0.75rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.55rem 0.9rem;
        max-width: calc(100% - 1.6rem);
        padding: 0.45rem 0.6rem;
        border: 1px solid #2c3c52;
        border-radius: 0.45rem;
        background: rgb(10 17 29 / 86%);
        color: #afbdd0;
        font-size: 0.72rem;
        pointer-events: none;
        backdrop-filter: blur(10px);
      }

      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 0.32rem;
      }

      .swatch {
        width: 0.65rem;
        height: 0.65rem;
        border: 1px solid currentColor;
        border-radius: 0.18rem;
        background: currentColor;
        opacity: 0.8;
      }

      .chunk { color: #72b7e5; }
      .transform { color: #edc967; }
      .compose { color: #b7a4f4; }
      .deliverable { color: #72d6a5; }
      .directive { color: #c0c7d2; }

      .details {
        min-width: 0;
        overflow: auto;
        border-left: 1px solid #27364a;
        background: rgb(12 20 33 / 94%);
      }

      .details-inner {
        padding: 1rem;
      }

      .eyebrow {
        margin: 0 0 0.25rem;
        color: #8fa3bc;
        font-size: 0.7rem;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        overflow-wrap: anywhere;
        font-size: 1.15rem;
        font-weight: 650;
        line-height: 1.35;
      }

      h2 {
        margin: 1.15rem 0 0.45rem;
        font-size: 0.73rem;
        font-weight: 650;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #91a4ba;
      }

      .badge-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        margin-top: 0.65rem;
      }

      .badge {
        padding: 0.15rem 0.38rem;
        border: 1px solid #3b4d65;
        border-radius: 999px;
        color: #b9c7d8;
        background: #142033;
        font-size: 0.68rem;
      }

      .source {
        margin: 0.7rem 0 0;
        color: #b9c7d8;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.76rem;
        overflow-wrap: anywhere;
      }

      .detail-grid {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        gap: 0.35rem 0.7rem;
        margin: 0;
        font-size: 0.78rem;
      }

      .detail-grid dt {
        color: #8093aa;
      }

      .detail-grid dd {
        margin: 0;
        overflow-wrap: anywhere;
      }

      .relation-list {
        display: grid;
        gap: 0.35rem;
      }

      .relation {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: center;
        gap: 0.45rem;
        width: 100%;
        padding: 0.42rem 0.5rem;
        text-align: left;
      }

      .edge-kind {
        color: #8fa3bc;
        font-size: 0.66rem;
        text-transform: uppercase;
      }

      .relation-label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .empty {
        color: #8fa3bc;
        font-size: 0.82rem;
        line-height: 1.55;
      }

      pre {
        margin: 0;
        overflow: auto;
        padding: 0.65rem;
        border: 1px solid #2d3d52;
        border-radius: 0.4rem;
        background: #0a1220;
        color: #b8c7d9;
        font-size: 0.7rem;
        line-height: 1.45;
      }

      @media (max-width: 820px) {
        .workspace {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: minmax(18rem, 2fr) minmax(12rem, 1fr);
        }

        .details {
          border-top: 1px solid #27364a;
          border-left: 0;
        }

        .status {
          width: 100%;
          margin-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <nav class="toolbar" aria-label="Explorer controls">
        <div class="brand">
          <strong>Ravel Explorer</strong>
          <span class="muted" id="project-label">loading…</span>
        </div>
        <label>
          <span class="muted">Lens</span>
          <select id="lens" aria-label="Graph lens">
            <option value="overview">Overview</option>
            <option value="dependencies" selected>Dependencies</option>
            <option value="derivation">Derivation</option>
          </select>
        </label>
        <label>
          <span class="muted">Find</span>
          <input id="search" type="search" placeholder="chunk, transform, output…" autocomplete="off">
        </label>
        <div class="separator" aria-hidden="true"></div>
        <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
        <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
        <button id="fit" type="button">Fit</button>
        <button id="layout" type="button">Relayout</button>
        <div class="separator" aria-hidden="true"></div>
        <button class="context-action" id="upstream" type="button" disabled>Upstream</button>
        <button class="context-action" id="downstream" type="button" disabled>Downstream</button>
        <button class="context-action" id="fold" type="button" disabled>Collapse</button>
        <button id="reset" type="button">Reset</button>
        <output class="status" id="status" aria-live="polite">Loading graph…</output>
      </nav>

      <section class="workspace">
        <div class="canvas-wrap">
          <div id="explorer" role="application" aria-label="Ravel project graph"></div>
          <div class="legend" aria-hidden="true">
            <span class="chunk"><i class="swatch"></i>chunk</span>
            <span class="transform"><i class="swatch"></i>transform</span>
            <span class="compose"><i class="swatch"></i>compose / emit</span>
            <span class="directive"><i class="swatch"></i>directive</span>
            <span class="deliverable"><i class="swatch"></i>deliverable</span>
          </div>
        </div>

        <aside class="details" aria-label="Selection details">
          <div class="details-inner" id="details">
            <p class="eyebrow">FizzBuzz migration</p>
            <h1>Select a graph entity</h1>
            <p class="empty">
              Click a node or edge to inspect its source location and relationships.
              Double-click a document to collapse or expand it.
            </p>
          </div>
        </aside>
      </section>
    </main>
    <script type="module" src="./generated/explorer.mjs"></script>
  </body>
</html>
