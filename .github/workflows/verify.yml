name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate:schema
      - run: npm run build:browser-test
      - run: npm pack --workspaces --dry-run --ignore-scripts --loglevel warn

  bun:
    name: Bun portable verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run test:bun
