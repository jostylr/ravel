version = 1

[build]
name = "adapter-conformance-markdown-litpro"
out_dir = ".ravel/build/markdown-litpro"

[[files]]
path = "markdown-litpro.md"
document = "field-report"
adapter = "markdown-litpro"
dialect = "litpro-plus"

[[live.resources]]
name = "observations.csv"
path = "observations.csv"

[[outputs]]
name = "report.md"
from = "field-report::report"

[[outputs]]
name = "summary.json"
from = "field-report::summary"

[[outputs]]
name = "alerts.txt"
from = "field-report::alerts"
