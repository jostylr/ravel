version = 1

[build]
name = "adapter-conformance-noweb"
out_dir = ".ravel/build/noweb"

[[files]]
path = "noweb.nw"
document = "field-report"
adapter = "noweb"
dialect = "noweb-plus"
references = "both"

[[live.resources]]
name = "observations.csv"
path = "observations.csv"

[[outputs]]
name = "report.md"
from = "field-report::report"

[[outputs]]
name = "summary.json"
from = "field-report::summary"

[[outputs]]
name = "alerts.txt"
from = "field-report::alerts"
