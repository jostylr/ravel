version = 1

[build]
name = "adapter-conformance-quarto"
out_dir = ".ravel/build/quarto"

[[files]]
path = "quarto.qmd"
document = "field-report"
mode = "primary"
profile = "modern"

[[live.resources]]
name = "observations.csv"
path = "observations.csv"

[[outputs]]
name = "report.md"
from = "field-report::report"

[[outputs]]
name = "summary.json"
from = "field-report::summary"

[[outputs]]
name = "alerts.txt"
from = "field-report::alerts"
